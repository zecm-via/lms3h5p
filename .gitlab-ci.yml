stages:
  - deploy

publish:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        curl --fail-with-body --header "Job-Token: $CI_JOB_TOKEN" \
          --data "tag=$CI_COMMIT_TAG" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
      else
        curl --fail-with-body --header "Job-Token: $CI_JOB_TOKEN" \
          --data "branch=$CI_COMMIT_BRANCH" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
      fi

